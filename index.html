<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Ustam CRM</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--b:#1D5FE0;--b2:#164BB5;--n:#0B1B3F;--m:#5A6785;--l:#EAF1FF;--line:#E3E9F5;--bg:#F5F8FD;--w:#FFFFFF;
--ok:#0F7A45;--okbg:#E4F5EC;--warn:#9A5300;--warnbg:#FFF1DC;--bad:#C42B2B;--badbg:#FDECEC;--pro:#5B3FD6;--probg:#EEEAFE;--r:16px;--h:'Unbounded',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--n);font:500 15px/1.45 Manrope,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--b);text-decoration:none}
.top{position:sticky;top:0;z-index:5;background:var(--w);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:12px;background:#EAF1FF;color:#fff;display:flex;align-items:flex-end;justify-content:center;flex:none;overflow:hidden}
.logo.adm{background:var(--n);align-items:center}
.brand b{display:block;font:700 15px/1.2 var(--h);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;font-size:12px;color:var(--m)}
.modes{display:flex;gap:4px;background:#E9EEF7;border-radius:10px;padding:3px;flex:none}
.modes button{height:30px;padding:0 10px;border-radius:8px;font-size:12px;font-weight:800;color:var(--m)}
.modes button.on{background:var(--w);color:var(--n)}
main{padding:16px 16px 110px;max-width:560px;margin:0 auto}
h2{font:600 16px/1.3 var(--h);margin:24px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
h2 small{font:600 12px Manrope,system-ui,sans-serif;color:var(--m)}
h3{font:600 18px/1.3 var(--h);margin:0 0 14px}
.hero{background:var(--n);color:#fff;border-radius:22px;padding:18px 18px 16px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(29,95,224,.45)}
.hero>*{position:relative;z-index:1}
.hero-l{font-size:12px;color:#A9C2F5;font-weight:600}
.hero-v{font:700 28px/1.15 var(--h);margin:6px 0 14px;letter-spacing:-.5px}
.hero-row{display:flex;gap:10px}
.hero-row div{flex:1;background:rgba(255,255,255,.08);border-radius:12px;padding:8px 10px;min-width:0}
.hero-row span{display:block;font-size:11px;color:#A9C2F5}
.hero-row b{font-weight:700;font-size:14px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.met{background:var(--w);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.met span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--m);font-weight:600}
.met b{display:block;font:700 16px/1.3 var(--h);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row2{display:flex;gap:10px;margin-top:14px}
.btn{height:48px;border-radius:14px;padding:0 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:1}
.btn.p{background:var(--b);color:#fff}.btn.p:active{background:var(--b2)}
.btn.g{background:var(--w);border:1px solid var(--line);color:var(--n)}
.btn.s{height:36px;border-radius:10px;font-size:13px;padding:0 12px;flex:none}
.btn.ok{background:var(--okbg);color:var(--ok)}.btn.no{background:var(--badbg);color:var(--bad)}
.btn.w{width:100%;flex:none}
.btn:disabled{opacity:.5}
.list{background:var(--w);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.it{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.av{width:40px;height:40px;border-radius:12px;background:var(--l);color:var(--b);font:700 14px var(--h);display:flex;align-items:center;justify-content:center;flex:none}
.it .mid{flex:1;min-width:0}
.it .mid b{display:flex;align-items:center;gap:6px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .mid span{display:block;font-size:12px;color:var(--m)}
.it .mid span.pill{display:inline-block;font-size:11px}
.it .end{text-align:right;flex:none}
.it .end b{display:block;font-weight:800}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--l);color:var(--b);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.bad{background:var(--badbg);color:var(--bad)}.pill.gray{background:#EEF0F4;color:#5F6676}.pill.pro{background:var(--probg);color:var(--pro)}
.ic{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--m);flex:none}
.ic:active{background:var(--l)}
.empty{background:var(--w);border:1px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;color:var(--m);font-size:14px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--w);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:#8A94AB;padding:6px 0;position:relative}
.nav button.on{color:var(--b)}
.nav i{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font:800 10px/18px Manrope,system-ui,sans-serif;font-style:normal}
.seg{display:flex;background:#E9EEF7;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:38px;border-radius:9px;font-weight:700;font-size:13px;color:var(--m)}
.seg button.on{background:var(--w);color:var(--n);box-shadow:0 1px 2px rgba(11,27,63,.12)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.sc{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.chips.sc::-webkit-scrollbar{display:none}
.chip{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--w);font-weight:700;font-size:13px;color:var(--n);flex:none;white-space:nowrap}
.chip.on{background:var(--l);border-color:var(--b);color:var(--b)}
label,.lbl{display:block;font-size:13px;font-weight:700;color:var(--m);margin:12px 0 6px}
label small{font-weight:500}
input,select,textarea{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--w);font-weight:600;outline:none;margin-top:6px}
textarea{height:110px;padding:12px 14px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--b);box-shadow:0 0 0 3px rgba(29,95,224,.15)}
.err{color:var(--bad);font-size:13px;font-weight:600;margin:10px 0 0;min-height:1px}
.hint{font-size:12px;color:var(--m);margin:6px 0 0}
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.on{display:block}
.sh-bg{position:absolute;inset:0;background:rgba(11,27,63,.45)}
.sh{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--w);border-radius:24px 24px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;animation:up .22s ease-out}
.sh-h{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
#toast{position:fixed;left:16px;right:16px;top:12px;z-index:30;display:flex;justify-content:center;pointer-events:none}
#toast div{background:var(--n);color:#fff;border-radius:14px;padding:12px 16px;font-weight:700;font-size:14px;max-width:420px;box-shadow:0 8px 24px rgba(11,27,63,.25);animation:up .2s}
#toast div.bad{background:var(--bad)}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--b);z-index:40;transition:width .4s}
#bar.on{width:80%;transition:width 6s cubic-bezier(.1,.7,.2,1)}
.center{min-height:88vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.big{width:72px;height:72px;border-radius:22px;background:var(--l);color:var(--b);display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.center h3{font-size:20px}.center p{color:var(--m);margin:0 0 20px;max-width:330px}
.spin{width:36px;height:36px;border:3px solid var(--l);border-top-color:var(--b);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.card{background:var(--w);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.shopcard{background:var(--n);color:#fff;border-radius:22px;padding:18px;position:relative;overflow:hidden}
.shopcard:after{content:"";position:absolute;right:-50px;bottom:-70px;width:170px;height:170px;border-radius:50%;background:rgba(29,95,224,.5)}
.shopcard>*{position:relative;z-index:1}
.shopcard small{font-size:11px;letter-spacing:2px;color:#A9C2F5;font-weight:700}
.shopcard h1{font:700 24px/1.15 var(--h);margin:4px 0 6px}
.shopcard p{margin:2px 0;color:#D5E2FB;font-size:13px;display:flex;gap:6px;align-items:flex-start}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 6px;margin:0 -16px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:62px;height:70px;border-radius:14px;border:1px solid var(--line);background:var(--w);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.day span{font-size:11px;color:var(--m);font-weight:700}.day b{font:700 18px var(--h)}
.day.on{background:var(--b);border-color:var(--b);color:#fff}.day.on span{color:#D5E2FB}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slot{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--w);font-weight:800;font-size:14px}
.slot.on{background:var(--b);border-color:var(--b);color:#fff}
.slot:disabled{background:#F1F3F8;color:#B3BACB;text-decoration:line-through;border-color:#F1F3F8}
.bookbar{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--w);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bookbar div{max-width:560px;margin:0 auto;display:flex;gap:12px;align-items:center}
.bookbar span{flex:1;font-weight:700;font-size:14px}.bookbar span small{display:block;color:var(--m);font-weight:600;font-size:12px}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%}
.bars i{display:block;border-radius:3px 3px 0 0;background:var(--b);min-height:2px}
.bars i.x{background:#F3A6A6}
.legend{display:flex;gap:14px;font-size:12px;color:var(--m);font-weight:600;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--b);margin-right:5px;vertical-align:-1px}
.legend i.x{background:#F3A6A6}
.notice{background:var(--warnbg);color:var(--warn);border-radius:var(--r);padding:14px;font-weight:600;font-size:14px}
.pv{border-radius:14px;overflow:hidden;border:1px solid var(--line);margin:12px auto 0;background:#fff}
#poster-host{position:absolute;left:-12000px;top:0}
.idbox{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--l);border-radius:14px;padding:12px 14px}
.idbox b{font:700 26px var(--h);color:var(--b)}
.idbox span{font-size:12px;color:var(--m);font-weight:600}
.menu .it{cursor:pointer}
.menu .it .av{background:var(--bg);color:var(--n)}
.tgl{position:relative;width:46px;height:28px;border-radius:14px;background:#D3D9E6;flex:none;transition:.2s}
.tgl:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tgl.on{background:var(--ok)}.tgl.on:after{left:21px}
.bar1{height:8px;border-radius:4px;background:var(--l);overflow:hidden;margin-top:6px}.bar1 i{display:block;height:100%;background:var(--b);border-radius:4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--m);font-weight:700;font-size:12px;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 6px;border-bottom:1px solid var(--line);font-weight:600}
.tbl td.r,.tbl th.r{text-align:right}
.lock{display:flex;gap:12px;align-items:center;background:var(--probg);color:var(--pro);border-radius:var(--r);padding:14px;font-weight:700;font-size:14px}
</style>
</head>
<body>
<div id="bar"></div>
<div id="app"><div class="center"><div class="spin"></div></div></div>
<div id="sheet"></div>
<div id="toast"></div>
<div id="poster-host"></div>

const I = (n, s = 20, c = 'currentColor') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

/* ---------- umumiy ---------- */
function toast(t, bad) { $('#toast').innerHTML = `<div class="${bad ? 'bad' : ''}">${esc(t)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => $('#toast').innerHTML = '', 3000); }
function busy(on) { $('#bar').className = on ? 'on' : ''; if (!on) { $('#bar').style.width = '100%'; setTimeout(() => $('#bar').style.width = '', 250); } }
const ERR = { net: 'Internet aloqasini tekshiring', auth: 'Ilovani botdagi tugma orqali qayta oching', role: 'Ruxsat yo‘q', server: 'Serverda xatolik. Birozdan keyin urinib ko‘ring', busy: 'Bu vaqt band', action: 'Noma’lum amal', obuna: 'Obuna muddati tugagan' };
function fail(e, errId) {
  const t = (e && e.msg) || ERR[e && e.error] || 'Xatolik yuz berdi';
  haptic('error');
  if (errId && $('#' + errId)) $('#' + errId).textContent = t; else toast(t, true);
}
async function api(action, data = {}, quiet) {
  if (!quiet) busy(true);
  try {
    let r, j;
    try { r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action, initData: tg.initData }, data)) }); } catch (x) { throw { error: 'net' }; }
    try { j = await r.json(); } catch (x) { throw { error: 'server' }; }
    if (j.error === 'obuna' && action !== 'me') { S.d = await api('me', {}, true); render(); }
    if (j.error) throw j;
    return j;
  } finally { if (!quiet) busy(false); }
}
function confirmBox(text) { return new Promise(res => { try { tg.showConfirm(text, ok => res(!!ok)); } catch (e) { res(confirm(text)); } }); }
function openSheet(html) {
  $('#sheet').innerHTML = `<div class="sh-bg" data-a="closeSheet"></div><div class="sh" role="dialog"><div class="sh-h"></div>${html}</div>`;
  $('#sheet').classList.add('on'); try { tg.BackButton.show(); } catch (e) { }
}
function closeSheet() {
  if ($('#sheet').classList.contains('on')) { $('#sheet').classList.remove('on'); $('#sheet').innerHTML = ''; }
  else if (S.sec) { S.sec = null; renderTab(); }
  try { if (!S.sec) tg.BackButton.hide(); } catch (e) { }
}
function screen(icon, title, text, btn) { $('#app').innerHTML = `<div class="center"><div class="big">${I(icon, 34)}</div><h3>${title}</h3><p>${text}</p>${btn || ''}</div>`; }
const loader = () => `<div style="display:flex;justify-content:center;padding:60px 0"><div class="spin"></div></div>`;
const met = (ic, l, v) => `<div class="met"><span>${I(ic, 15)}${l}</span><b>${v}</b></div>`;
const PAY = { naqd: ['Naqd', 'ok'], karta: ['Karta', ''], nasiya: ['Nasiya', 'warn'] };
const BST = { kutilmoqda: ['Kutilmoqda', 'warn'], tasdiqlandi: ['Tasdiqlangan', 'ok'], rad: ['Rad etilgan', 'bad'], bekor: ['Bekor qilingan', 'gray'], keldi: ['Keldi', ''] };
const TFC = { start: 'gray', standart: '', biznes: 'pro' };

/* ---------- ishga tushish ---------- */
async function boot() {
  if (!tg || !tg.initData) return screen('lock', 'Telegram orqali oching', 'Bu ilova faqat Telegram bot ichida ishlaydi. Botga kirib, «Ustam CRM» tugmasini bosing.');
  tg.ready(); tg.expand();
  try { tg.setHeaderColor('#FFFFFF'); tg.setBackgroundColor('#F5F8FD'); tg.BackButton.onClick(closeSheet); } catch (e) { }
  const s = new URLSearchParams(location.search).get('s');
  try { S.d = await api('me', { s }); }
  catch (e) { return screen('lock', 'Ochilmadi', esc(e.msg || ERR[e.error] || 'Xatolik'), `<button class="btn p" style="flex:none;width:220px" data-a="reload">Qayta urinish</button>`); }
  S.mode = S.d.role;
  render();
}
function modesBar() {
  const d = S.d, m = [];
  if (d.staff) m.push(['staff', 'Ish']);
  if (d.client) m.push(['client', 'Mijoz']);
  if (d.admin) m.push(['admin', 'Admin']);
  return m.length > 1 ? `<div class="modes">${m.map(x => `<button class="${S.mode === x[0] ? 'on' : ''}" data-a="mode" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>` : '';
}
function render() {
  const m = S.mode;
  if (m === 'staff') return S.d.expired ? renderExpired() : renderStaff();
  if (m === 'client') return renderClient();
  if (m === 'admin') return renderAdmin();
  screen('user', 'Siz hali ro‘yxatdan o‘tmagansiz',
    'Sartaroshxonadagi QR kodni telefon kamerasi bilan skanerlang yoki botga sartaroshxona ID raqamini yozing.<br><br>Sartaroshxona egasi bo‘lsangiz, botda <b>/usta</b> buyrug‘ini bosing.',
    `<button class="btn p" style="flex:none;width:220px" data-a="closeApp">Botga qaytish</button>`);
}

const isOwner = () => S.d.staff && S.d.staff.role === 'egasi';
const isPanel = () => isOwner() && S.d.shop.panel;

function mfChips() {

const mfArg = () => isPanel() ? { master: S.mf } : {};

async function renderTab() {
  const m = $('#main'); if (!m) return;
  const t = S.tab;
  if (t === 'bugun') {
    if (S.dashStale) { S.dashStale = false; try { S.d.dash = await api('u_dash', mfArg()); } catch (e) { fail(e); } }
    m.innerHTML = mfChips() + tBugun();
  }
  if (t === 'bron') {
    if (!S.bookings) { m.innerHTML = loader(); try { S.bookings = (await api('u_bookings', {}, true)).bookings; } catch (e) { return fail(e); } }
    m.innerHTML = tBron();
  }
  if (t === 'mijoz') {
    if (!S.clients) { m.innerHTML = loader(); try { S.clients = (await api('u_clients', {}, true)).clients; } catch (e) { return fail(e); } }

async function visitSave(el) {
  const client = val('f-client').trim(), phone = val('f-phone').trim(), sum = +val('f-sum'), pay = picked('g-pay');
  if (!client) return fail({ msg: 'Mijoz ismini yozing' }, 'f-err');
  if (!(sum > 0)) return fail({ msg: 'Summani yozing' }, 'f-err');
  if (phone && digits(phone).length < 9) return fail({ msg: 'Telefon raqam to‘liq emas' }, 'f-err');
  if (pay === 'nasiya' && digits(phone).length < 9) return fail({ msg: 'Nasiya uchun telefon raqamni yozing' }, 'f-err');
  if (isPanel() && !picked('g-mst')) return fail({ msg: 'Ustani tanlang' }, 'f-err');
  el.disabled = true;
  try {
    S.d.dash = await api('u_visit_add', Object.assign({ client, phone, sum, pay, service: picked('g-svc'), bookingId: el.dataset.bid, masterId: picked('g-mst') }, mfArg()));
    S.clients = null; S.report = null; if (el.dataset.bid) S.bookings = null;
    closeSheet(); haptic('success'); toast('Saqlandi: ' + client + ' · ' + som(sum));
    S.tab = 'bugun'; renderStaff();
  } catch (e) { el.disabled = false; fail(e, 'f-err'); }
}
function expForm() {

/* --- bronlar --- */
function tBron() {
  const t = S.d.today, f = S.bf, panel = isPanel();
  const all = S.bookings || [];
  const list = all.filter(b => f === 'hammasi' || (b.status === f && b.date >= t));
  const cnt = st => all.filter(b => b.status === st && b.date >= t).length;
  const groups = {};
  list.forEach(b => (groups[b.date] = groups[b.date] || []).push(b));
  const dl = d => d === t ? 'Bugun' : d === addD(t, 1) ? 'Ertaga' : d === addD(t, -1) ? 'Kecha' : HF[wd(d)];
  const mineOrPanel = b => panel || String(b.masterId) === String(S.d.staff.id);
  return `<div class="seg">
    <button class="${f === 'kutilmoqda' ? 'on' : ''}" data-a="bf" data-v="kutilmoqda">Yangi (${cnt('kutilmoqda')})</button>
    <button class="${f === 'tasdiqlandi' ? 'on' : ''}" data-a="bf" data-v="tasdiqlandi">Tasdiqlangan (${cnt('tasdiqlandi')})</button>
    <button class="${f === 'hammasi' ? 'on' : ''}" data-a="bf" data-v="hammasi">Hammasi</button></div>
  ${Object.keys(groups).length ? Object.keys(groups).sort().map(d => `<h2>${dl(d)} · ${fd(d)} <small>${groups[d].length} ta</small></h2><div class="list">${groups[d].map(b => `
    <div class="it" style="align-items:flex-start"><div class="av" style="font-size:12px">${b.time}</div>
    <div class="mid"><b>${esc(b.name)}</b><span><a href="tel:${esc(b.phone)}">${phoneF(b.phone)}</a>${panel ? ' · usta ' + esc(b.masterName) : ''}</span>
    <div style="margin-top:6px"><span class="pill ${BST[b.status][1]}">${BST[b.status][0]}</span></div>
    ${mineOrPanel(b) && b.status === 'kutilmoqda' ? `<div style="display:flex;gap:8px;margin-top:10px"><button class="btn s ok" data-a="bkSet" data-id="${b.id}" data-st="tasdiqlandi">Tasdiqlash</button><button class="btn s no" data-a="bkSet" data-id="${b.id}" data-st="rad">Rad etish</button></div>` : ''}
    ${mineOrPanel(b) && b.status === 'tasdiqlandi' ? `<div style="display:flex;gap:8px;margin-top:10px"><button class="btn s ok" data-a="came" data-id="${b.id}">Mijoz keldi</button><button class="btn s g" data-a="bkSet" data-id="${b.id}" data-st="bekor">Bekor qilish</button></div>` : ''}
    </div></div>`).join('')}</div>`).join('')
      : `<div class="empty" style="margin-top:14px">${f === 'kutilmoqda' ? 'Yangi bron yo‘q. Mijozlar QR kod orqali bron qilsa, shu yerda va botda ko‘rinadi.' : 'Bron yo‘q'}</div>`}`;
}
async function bkSet(el) {
  const st = el.dataset.st;
  if (st !== 'tasdiqlandi' && !(await confirmBox(st === 'rad' ? 'Bron rad etilsinmi? Mijozga xabar boradi.' : 'Bron bekor qilinsinmi? Mijozga xabar boradi.'))) return;
  el.disabled = true;
  try {
    S.bookings = (await api('u_book_set', { id: el.dataset.id, status: st })).bookings;
    S.d.dash.pending = S.bookings.filter(b => b.status === 'kutilmoqda' && b.date >= S.d.today && (isPanel() || String(b.masterId) === String(S.d.staff.id))).length;
    S.dashStale = true; haptic('success');
    toast(st === 'tasdiqlandi' ? 'Tasdiqlandi — mijozga xabar ketdi' : 'Mijozga xabar ketdi');
    renderStaff();

  const mx = Math.max(1, ...st.byTariff.map(x => x.n));

  const T = S.d.tariffs[x.tariff] || S.d.tariffs.start;
  const lc = x.status === 'bloklangan' ? 'bad' : x.left < 0 ? 'bad' : x.left <= 3 ? 'warn' : 'ok';
  const lt = x.status === 'bloklangan' ? 'bloklangan' : x.left < 0 ? 'tugagan' : x.left + ' kun';
  return `<div class="it" style="align-items:flex-start" data-a="aShop" data-id="${x.id}"><div class="av">${esc(ini(x.shop))}</div>
  <div class="mid"><b>${esc(x.shop)} <span class="pill ${TFC[x.tariff]}">${T.name}</span></b><span>ID ${x.id} · ${esc(x.owner)} · ${phoneF(x.phone)}</span>
  <span style="margin-top:4px">${x.masters}/${T.max} usta · ${fd(x.paidUntil)} gacha <span class="pill ${lc}">${lt}</span></span></div>${I('chev', 18, '#8A94AB')}</div>`;
}
function aShops() {
  const f = S.aF;
  return `<input id="aq" placeholder="Nomi, ID yoki telefon" value="${esc(S.aQ)}" style="margin:0 0 10px">
  <div class="chips sc">${[['all', 'Hammasi'], ['active', 'Faol'], ['exp', 'Tugagan'], ['start', 'Start'], ['standart', 'Standart'], ['biznes', 'Biznes']].map(x => `<button class="chip ${f === x[0] ? 'on' : ''}" data-a="aF" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>
  <div id="a-res" style="margin-top:12px"></div>`;
}
function drawShops() {
  const q = S.aQ.toLowerCase().trim(), f = S.aF;
  let L = S.A.shops;
  if (f === 'active') L = L.filter(x => !x.expired); else if (f === 'exp') L = L.filter(x => x.expired); else if (f !== 'all') L = L.filter(x => x.tariff === f);
  if (q) L = L.filter(x => x.shop.toLowerCase().includes(q) || String(x.id).includes(q) || (digits(q) && digits(x.phone).includes(digits(q))) || String(x.owner).toLowerCase().includes(q));
  const box = $('#a-res'); if (!box) return;
  box.innerHTML = L.length ? `<p class="hint" style="margin:0 0 8px">${L.length} ta</p><div class="list menu">${L.map(shopRow).join('')}</div>` : '<div class="empty">Topilmadi</div>';
}
function aShop(el) {
  const x = S.A.shops.find(s => String(s.id) === el.dataset.id); if (!x) return;
  const T = S.d.tariffs;
  openSheet(`<h3>${esc(x.shop)}</h3>
  <div class="card" style="font-size:14px;line-height:1.8">ID: <b>${x.id}</b><br>Egasi: <b>${esc(x.owner)}</b> · <a href="tel:${esc(x.phone)}">${phoneF(x.phone)}</a><br>Manzil: ${esc(x.address)}<br>Tarif: <b>${T[x.tariff].name}</b> · ${x.masters}/${T[x.tariff].max} usta<br>Muddat: <b>${fd(x.paidUntil)}</b> gacha · Ro‘yxatdan: ${esc(String(x.created).slice(0, 10))}</div>
  <h2>To‘lov qabul qilish</h2>
  <div class="lbl" style="margin-top:0">Tarif</div><div class="seg" id="g-tf">${Object.keys(T).map(k => `<button class="${k === x.tariff ? 'on' : ''}" data-a="pickAmt" data-g="g-tf" data-v="${k}">${T[k].name}</button>`).join('')}</div>
  <div class="lbl">Necha oy</div><div class="chips" id="g-mo">${[1, 3, 6, 12].map((n, i) => `<button class="chip ${i ? '' : 'on'}" data-a="pickAmt" data-g="g-mo" data-v="${n}">${n} oy</button>`).join('')}</div>
  <label>Summa (so‘m)<input id="ex-amt" type="number" value="${T[x.tariff].price}"></label>
  <p class="err" id="ex-err"></p>
  <button class="btn p w" style="margin-top:8px" data-a="aExtend" data-id="${x.id}">${I('money', 18)} To‘lovni tasdiqlash</button>
  <div class="row2"><button class="btn g" data-a="aMsgOne" data-id="${x.id}">${I('send', 18)} Xabar</button>
  <button class="btn ${x.status === 'bloklangan' ? 'ok' : 'no'}" data-a="aBlock" data-id="${x.id}" data-b="${x.status === 'bloklangan' ? '0' : '1'}">${x.status === 'bloklangan' ? 'Blokdan chiqarish' : 'Bloklash'}</button></div>`);
}
function pickAmt(el) {
  A.pick(el);
  const T = S.d.tariffs, k = picked('g-tf'), n = +picked('g-mo');
  if (k && n && $('#ex-amt')) $('#ex-amt').value = T[k].price * n;
}
async function aExtend(el) {
  const tariff = picked('g-tf'), months = +picked('g-mo'), amount = +val('ex-amt');
  if (!(amount > 0)) return fail({ msg: 'Summani yozing' }, 'ex-err');
  if (!(await confirmBox(`${S.d.tariffs[tariff].name} · ${months} oy · ${som(amount)} — tasdiqlaysizmi?`))) return;
  el.disabled = true;
  try { S.A = await api('a_extend', { shopId: el.dataset.id, tariff, months, amount }); S.hist = null; closeSheet(); haptic('success'); toast('To‘lov qabul qilindi, egasiga xabar ketdi'); renderATab(); }
  catch (e) { el.disabled = false; fail(e, 'ex-err'); }
}
async function aBlock(el) {
  const b = el.dataset.b === '1';
  if (!(await confirmBox(b ? 'Sartaroshxona bloklansinmi? Ustalar va mijozlar foydalana olmaydi.' : 'Blokdan chiqarilsinmi?'))) return;
  try { S.A = await api('a_block', { shopId: el.dataset.id, block: b }); closeSheet(); toast(b ? 'Bloklandi' : 'Ochildi'); renderATab(); } catch (e) { fail(e); }
}
function msgForm(one) {
  return `<div class="lbl">Kimga</div>
  ${one ? `<div class="card" style="font-weight:700">${esc(one.shop)} (ID ${one.id})</div>` : `<select id="am-target"><option value="all">Barcha sartaroshxonalar</option><option value="expiring">Muddati tugayotganlar (3 kun)</option><option value="start">Start tarifidagilar</option><option value="standart">Standart tarifidagilar</option><option value="biznes">Biznes tarifidagilar</option></select>`}
  <div class="seg" id="g-who" style="margin-top:10px"><button class="on" data-a="pick" data-g="g-who" data-v="egasi">Faqat egalariga</button><button data-a="pick" data-g="g-who" data-v="all">Barcha ustalarga</button></div>
  <div class="lbl">Qanday</div><div class="seg" id="g-ach"><button class="on" data-a="pick" data-g="g-ach" data-v="tg">Telegram</button><button data-a="pick" data-g="g-ach" data-v="sms">SMS</button><button data-a="pick" data-g="g-ach" data-v="both">Ikkalasi</button></div>
  <p class="hint">SMS sizning admin telefoningiz SIM kartasidan ketadi (Sozlama → SMS telefon).</p>
  <label>Xabar matni<textarea id="am-text" placeholder="Masalan: Yangi imkoniyat qo‘shildi — ..."></textarea></label>
  <p class="err" id="am-err"></p>
  <button class="btn p w" style="margin-top:8px" data-a="aSend" data-id="${one ? one.id : ''}">${I('send', 18)} Yuborish</button>`;
}
function aMsg() {
  const H2 = (S.hist && S.hist.msgs) || [];
  return `<h3>Ustalarga xabar</h3><div class="card">${msgForm()}</div>
  <h2>Yuborilgan xabarlar <small>${H2.length} ta</small></h2>
  ${H2.length ? `<div class="list">${H2.map(h => `<div class="it"><div class="mid"><b>${esc(String(h.text).slice(0, 60))}</b><span>${esc(h.date)} · ${esc(h.by)} · ${esc(h.target)} · TG ${h.tg} · SMS ${h.sms}</span></div></div>`).join('')}</div>` : '<div class="empty">Hali xabar yuborilmagan</div>'}`;
}
function aMsgOne(el) { const x = S.A.shops.find(s => String(s.id) === el.dataset.id); openSheet(`<h3>Xabar yuborish</h3>${msgForm(x)}`); }
async function aSend(el) {
  const text = val('am-text').trim();
  if (text.length < 3) return fail({ msg: 'Xabar matnini yozing' }, 'am-err');
  const one = el.dataset.id;
  if (!(await confirmBox('Xabar yuborilsinmi?'))) return;
  el.disabled = true; el.textContent = 'Yuborilmoqda…';
  try {
    const r = await api('a_msg', { text, channel: picked('g-ach'), who: picked('g-who'), target: one ? 'one' : val('am-target'), shopId: one });
    haptic('success'); closeSheet(); S.hist = null;
    toast(`Yuborildi: ${r.people} kishi · TG ${r.tg} · SMS navbatga ${r.sms}${r.fail ? ' · xato ' + r.fail : ''}`);
    if (S.aTab === 'msg') renderATab();
  } catch (e) { el.disabled = false; el.textContent = 'Yuborish'; fail(e, 'am-err'); }
}
function aSet() {
  const A2 = S.admins, sup = S.d.super, pays = (S.hist && S.hist.pays) || [];
  return `<h3>Adminlar</h3>
  <div class="list"><div class="it"><div class="av" style="background:var(--n);color:#fff">${I('shield', 18)}</div><div class="mid"><b>Asosiy admin</b><span>Script Properties’dagi ADMIN_ID</span></div></div>
  ${A2.admins.map(a => `<div class="it"><div class="av">${esc(ini(a.name))}</div><div class="mid"><b>${esc(a.name || a.tgId)}</b><span>ID ${esc(a.tgId)} · ${esc(String(a.added).slice(0, 10))}</span></div>${sup ? `<button class="ic" data-a="aAdmRm" data-id="${esc(a.tgId)}" aria-label="O‘chirish">${I('trash', 18)}</button>` : ''}</div>`).join('')}</div>
  ${sup ? `<button class="btn p w" style="margin-top:12px" data-a="aAdmInv">${I('plus', 20)} Admin (sherik) qo‘shish</button><p class="hint" style="text-align:center">Adminlar hamma narsani ko‘radi va boshqaradi, faqat admin qo‘sha olmaydi.</p>` : ''}
  <h3 style="margin-top:24px">Admin SMS telefoni</h3>
  <div class="card" style="font-size:13px;color:var(--m)">Ustalarga SMS <b style="color:var(--n)">sizning telefoningiz SIM kartasidan</b> ketadi. Sartaroshxonalar telefonlari bu yerga aralashmaydi.</div>
  ${deviceBlock(A2.sms, 'admin', sup)}
  ${smsLog(A2.sms)}
  <h2>To‘lovlar tarixi <small>${pays.length} ta</small></h2>
  ${pays.length ? `<div class="list">${pays.map(p => `<div class="it"><div class="mid"><b>${esc(p.shop)} · ${esc((S.d.tariffs[p.tariff] || {}).name || p.tariff)} · ${p.months} oy</b><span>${esc(p.date)} · ${esc(p.by)}</span></div><div class="end"><b>${fmt(p.amount)}</b></div></div>`).join('')}</div>` : '<div class="empty">Hali to‘lov yo‘q</div>'}`;
}
async function aAdmInv(el) {
  el.disabled = true;
  try {
    const r = await api('a_admin_invite');
    openSheet(`<h3>Admin taklifi</h3><p style="color:var(--m);margin:0 0 12px">Havolani sherigingizga yuboring. 48 soat amal qiladi, bir marta ishlatiladi.</p>
    <div class="card" style="word-break:break-all;font-size:13px;font-weight:700">${esc(r.link)}</div>
    <button class="btn p w" style="margin-top:12px" data-a="share" data-v="${esc(r.link)}" data-t="Ustam CRM admin paneliga qo‘shiling">${I('send', 18)} Telegram orqali yuborish</button>
    <button class="btn g w" style="margin-top:8px" data-a="copy" data-v="${esc(r.link)}">Nusxalash</button>`);
  } catch (e) { fail(e); }
  el.disabled = false;
}

/* ================= HODISALAR ================= */
const A = {
  reload: () => location.reload(),
  closeApp: () => tg.close(),
  closeSheet,
  contact: () => { try { tg.openTelegramLink('https://t.me/' + S.d.contact.replace('@', '')); } catch (e) { } },
  mode: el => { S.mode = el.dataset.v; closeSheet(); render(); window.scrollTo(0, 0); },
  refresh: async () => { try { S.d = await api('me'); S.clients = S.bookings = S.report = S.team = S.sms = null; render(); toast('Yangilandi'); } catch (e) { fail(e); } },
  tab: el => { S.tab = el.dataset.t; S.sec = null; renderStaff(); window.scrollTo(0, 0); },
  mf: async el => { S.mf = el.dataset.v; S.report = null; if (S.tab === 'bugun') S.dashStale = true; renderTab(); },
  visitForm: () => visitForm(), visitSave, expForm, expSave,
  expName: el => { $('#x-name').value = el.dataset.v; $('#x-sum').focus(); },
  pick: el => { document.querySelectorAll('#' + el.dataset.g + ' .on').forEach(b => b.classList.remove('on')); el.classList.add('on'); },
  pickAmt,
  del: async el => {
    if (!(await confirmBox('O‘chirilsinmi?'))) return;
    try { S.d.dash = await api('u_del', Object.assign({ id: el.dataset.id, kind: el.dataset.kind }, mfArg())); S.report = null; S.clients = null; toast('O‘chirildi'); renderTab(); } catch (e) { fail(e); }
  },
  bf: el => { S.bf = el.dataset.v; renderTab(); },
  bkSet, came, clientForm, clientSave,
  per: el => { S.period = el.dataset.v; S.report = null; renderTab(); },
  debtPay, saveSet, posterPdf,
  sec: el => { S.sec = el.dataset.v; renderTab(); window.scrollTo(0, 0); },
  secBack: () => { S.sec = null; renderTab(); },
  tariffs: tariffsSheet,
  invite,
  staffRm: async el => {
    if (!(await confirmBox(el.dataset.n + ' jamoadan chiqarilsinmi?'))) return;
    try { S.team = await api('o_staff_remove', { tgId: el.dataset.id }); S.d = await api('me', {}, true); toast('Chiqarildi'); renderStaff(); } catch (e) { fail(e); }
  },
  works: async el => {
    try { S.team = await api('o_works', { works: !S.d.staff.works }); S.d = await api('me', {}, true); toast(S.d.staff.works ? 'Siz ham usta sifatida ko‘rinasiz' : 'Mijozlar sizni tanlay olmaydi'); renderStaff(); } catch (e) { fail(e); }
  },
  smsOn: el => { const k = el.dataset.k; S.sms.cfg.on[k] = !S.sms.cfg.on[k]; el.classList.toggle('on', S.sms.cfg.on[k]); },
  smsSave,
  smsTest: async el => {
    const ph = val('sm-test');
    if (digits(ph).length < 9) return toast('Raqamni yozing', true);
    el.disabled = true;
    try { await api('o_sms_test', { phone: ph }); toast('Sinov SMS navbatga qo‘yildi — telefon 1 daqiqada yuboradi'); S.sms = null; renderTab(); } catch (e) { fail(e); }
    el.disabled = false;
  },
  massSend,
  share: el => { const u = 'https://t.me/share/url?url=' + encodeURIComponent(el.dataset.v) + '&text=' + encodeURIComponent(el.dataset.t || ''); try { tg.openTelegramLink(u); } catch (e) { window.open(u); } },
  copy: el => { const v = el.dataset.v; (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(() => toast('Nusxalandi'), () => toast(v)); },
  cMaster: el => { S.cMaster = el.dataset.v; document.querySelectorAll('[data-a=cMaster]').forEach(b => b.classList.toggle('on', b === el)); loadSlots(); },
  cDay: el => { S.cDate = el.dataset.v; document.querySelectorAll('.day').forEach(b => b.classList.toggle('on', b === el)); loadSlots(); },
  cPick: el => { S.pick = el.dataset.v; drawSlots(); drawBar(); try { tg.HapticFeedback.selectionChanged(); } catch (e) { } },
  cBook, cCancel,
  aTab: el => { S.aTab = el.dataset.t; renderAdmin(); window.scrollTo(0, 0); },
  aRefresh: async () => { S.A = S.hist = S.admins = null; renderATab(); },
  aF: el => { S.aF = el.dataset.v; document.querySelectorAll('[data-a=aF]').forEach(b => b.classList.toggle('on', b === el)); drawShops(); },
  aShop, aExtend, aBlock, aMsgOne, aSend, aAdmInv,
  aAdmRm: async el => { if (!(await confirmBox('Admin o‘chirilsinmi?'))) return; try { const r = await api('a_admin_remove', { tgId: el.dataset.id }); S.admins.admins = r.admins; renderATab(); } catch (e) { fail(e); } },
  smsPair,
  openApk: el => { try { tg.openLink(el.dataset.v); } catch (e) { window.open(el.dataset.v); } },
  smsUnpair: async el => {
    if (!(await confirmBox('Bu telefon uzilsinmi? U endi SMS yubormaydi.'))) return;
    const admin = el.dataset.k === 'admin';
    try { await api(admin ? 'a_sms_unpair' : 'o_sms_unpair', { id: el.dataset.id }); toast('Telefon uzildi'); if (admin) { S.admins = null; renderATab(); } else { S.sms = null; renderTab(); } } catch (e) { fail(e); }
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const f = A[el.dataset.a];
  if (f) { e.preventDefault(); f(el); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; drawClients(); }
  if (e.target.id === 'aq') { S.aQ = e.target.value; drawShops(); }
});
boot();
</script>
</body>
</html>
