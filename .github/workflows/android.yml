name: Ustam SMS APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Imzo kaliti (agar sirlar qo'shilgan bo'lsa)
        env:
          KS_B64: ${{ secrets.USTAM_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ustam.jks"
            echo "USTAM_KEYSTORE_FILE=$RUNNER_TEMP/ustam.jks" >> "$GITHUB_ENV"
            echo "Doimiy kalit bilan imzolanadi"
          else
            echo "Sirlar yo'q — debug kalit bilan imzolanadi"
          fi

      - name: APK yig'ish
        working-directory: android
        env:
          USTAM_KEYSTORE_PASSWORD: ${{ secrets.USTAM_KEYSTORE_PASSWORD }}
          USTAM_KEY_ALIAS: ${{ secrets.USTAM_KEY_ALIAS }}
          USTAM_KEY_PASSWORD: ${{ secrets.USTAM_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Nomlash
        run: cp android/app/build/outputs/apk/release/app-release.apk UstamSMS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UstamSMS
          path: UstamSMS.apk

      - name: Release (yuklab olish havolasi)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "sms-v1.0.${{ github.run_number }}" UstamSMS.apk \
            --title "Ustam SMS v1.0.${{ github.run_number }}" \
            --notes "Ustam SMS Android ilovasi. Yuklab olish: UstamSMS.apk" \
            --latest
